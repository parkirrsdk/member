<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NFC UID Reader - Baca kartu NFC dan kirim ke WhatsApp">
    <title>NFC UID Reader - WhatsApp Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-custom {
            animation: bounce 1s ease-in-out;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-border {
            position: relative;
            background: linear-gradient(white, white) padding-box,
                        linear-gradient(135deg, #667eea 0%, #764ba2 100%) border-box;
            border: 2px solid transparent;
        }

        /* ====== WAVY FILTER STYLES ====== */
        /* apply the svg filter when the svg has .wavy class */
        .wavy {
            /* apply the SVG filter defined in the DOM below */
            filter: url(#wavy);
            /* improve rendering for animation */
            will-change: filter;
        }

        /* fallback: subtle scale during scanning to emphasize animation */
        .wavy-fallback {
            transform-origin: center;
            animation: wavyScale 1.2s ease-in-out infinite;
        }
        @keyframes wavyScale {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        /* small tune for mobile so displacement not too strong */
        @media (max-width: 640px) {
            /* nothing specific for now */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Invisible SVG defs for the wavy filter -->
    <svg width="0" height="0" style="position:absolute; pointer-events:none; left:0; top:0;">
        <defs>
            <!--
                feTurbulence + feDisplacementMap creates a wavy distortion.
                animate on baseFrequency to make the wave move.
            -->
            <filter id="wavy" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.02 0.6" numOctaves="2" result="noise">
                    <!-- SMIL animation to vary baseFrequency for moving waves -->
                    <animate attributeName="baseFrequency"
                             dur="1.6s"
                             values="0.02 0.6;0.03 0.8;0.02 0.6"
                             repeatCount="indefinite" />
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon Components (using lucide)
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                nfc: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M6 8.32a7.43 7.43 0 0 1 0 7.36"/><path d="M9.46 6.21a11.76 11.76 0 0 1 0 11.58"/><path d="M12.91 4.1a15.91 15.91 0 0 1 .01 15.8"/><path d="M16.37 2a20.16 20.16 0 0 1 0 20"/></svg>`,
                send: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>`,
                copy: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`,
                history: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>`,
                phone: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
                check: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="M20 6 9 17l-5-5"/></svg>`,
                checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>`,
                alertCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`,
                arrowLeft: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
                smartphone: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>`
            };
            return <span dangerouslySetInnerHTML={{ __html: icons[name] || '' }} />;
        };

        function NFCReaderApp() {
            const [currentPage, setCurrentPage] = useState('scan');
            const [uid, setUid] = useState('');
            const [cardType, setCardType] = useState('');
            const [scanTime, setScanTime] = useState('');
            const [status, setStatus] = useState('Siap untuk memindai');
            const [statusType, setStatusType] = useState('ready');
            const [isScanning, setIsScanning] = useState(false);
            const [scanHistory, setScanHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [nfcSupported, setNfcSupported] = useState(true);
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                if (!('NDEFReader' in window)) {
                    setNfcSupported(false);
                    setStatus('NFC tidak didukung di browser ini');
                    setStatusType('error');
                }

                const savedHistory = localStorage.getItem('nfc_history');
                if (savedHistory) setScanHistory(JSON.parse(savedHistory));
            }, []);

            const startNFCScan = async () => {
                if (!('NDEFReader' in window)) {
                    alert('NFC is not supported on this browser. Please use Chrome on Android or Safari on iOS 13+');
                    return;
                }

                try {
                    setIsScanning(true);
                    setStatus('Memindai... Tempelkan kartu NFC Anda');
                    setStatusType('scanning');

                    const ndef = new NDEFReader();
                    await ndef.scan();

                    ndef.addEventListener('reading', ({ message, serialNumber }) => {
                        const uidHex = (serialNumber || '').toUpperCase().replace(/:/g, '');
                        const timestamp = new Date().toLocaleString('id-ID');
                        
                        setUid(uidHex);
                        setScanTime(timestamp);
                        
                        let type = 'Unknown';
                        if (uidHex.length === 8) type = 'MIFARE Classic/Ultralight';
                        else if (uidHex.length === 14) type = 'ISO-DEP/DESFire';
                        else if (uidHex.length === 16) type = 'MIFARE Classic 7-byte';
                        
                        setCardType(type);
                        setStatus('Kartu terdeteksi berhasil!');
                        setStatusType('success');
                        
                        if (navigator.vibrate) {
                            navigator.vibrate(100);
                        }
                        
                        saveToHistory(uidHex, type, timestamp);
                        
                        setIsScanning(false);
                        
                        setTimeout(() => {
                            setCurrentPage('result');
                        }, 500);
                    });

                    ndef.addEventListener('readingerror', () => {
                        setStatus('Error membaca kartu NFC. Coba lagi.');
                        setStatusType('error');
                        setIsScanning(false);
                    });

                } catch (error) {
                    console.error('NFC Error:', error);
                    if (error.name === 'NotAllowedError') {
                        setStatus('Izin NFC ditolak. Silakan izinkan akses NFC.');
                    } else {
                        setStatus('Error: ' + error.message);
                    }
                    setStatusType('error');
                    setIsScanning(false);
                }
            };

            const saveToHistory = (uidValue, type, timestamp) => {
                const newEntry = {
                    uid: uidValue,
                    type: type,
                    timestamp: timestamp
                };
                
                const updatedHistory = [newEntry, ...scanHistory].slice(0, 50);
                setScanHistory(updatedHistory);
                localStorage.setItem('nfc_history', JSON.stringify(updatedHistory));
            };

            const copyUID = () => {
                if (!uid) {
                    alert('Tidak ada UID untuk disalin');
                    return;
                }
                
                navigator.clipboard.writeText(uid).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            const sendToWhatsApp = () => {
                if (!uid) {
                    alert('Silakan pindai kartu NFC terlebih dahulu');
                    return;
                }

                const message = uid;

                const whatsappApp = `whatsapp://send?text=${encodeURIComponent(message)}`;
                const whatsappWeb = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;

                if (navigator.share) {
                    navigator.share({ text: message })
                        .catch(() => {
                            tryOpenWhatsApp();
                        });
                    return;
                }

                tryOpenWhatsApp();

                function tryOpenWhatsApp() {
                    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    if (isMobile) {
                        window.location.href = whatsappApp;
                        setTimeout(() => {
                            window.open(whatsappWeb, '_blank');
                        }, 1200);
                    } else {
                        window.open(whatsappWeb, '_blank');
                    }
                }
            };

            const scanAgain = () => {
                setCurrentPage('scan');
                setUid('');
                setCardType('');
                setScanTime('');
                setStatus('Siap untuk memindai');
                setStatusType('ready');
                setCopied(false);
            };

            const clearHistory = () => {
                if (confirm('Hapus semua riwayat pemindaian?')) {
                    setScanHistory([]);
                    localStorage.removeItem('nfc_history');
                    setShowHistory(false);
                }
            };

            const getStatusColor = () => {
                switch (statusType) {
                    case 'success': return 'text-green-600';
                    case 'error': return 'text-red-600';
                    case 'scanning': return 'text-blue-600';
                    default: return 'text-indigo-600';
                }
            };

            const getStatusIcon = () => {
                switch (statusType) {
                    case 'success': return <Icon name="checkCircle" />;
                    case 'error': return <Icon name="alertCircle" />;
                    default: return null;
                }
            };

            // ========== HALAMAN SCAN ==========
            if (currentPage === 'scan') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 sm:p-8 relative overflow-hidden">
                        {/* Background decoration */}
                        <div className="absolute inset-0 overflow-hidden">
                            <div className="absolute -top-40 -right-40 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float"></div>
                            <div className="absolute -bottom-40 -left-40 w-80 h-80 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float" style={{animationDelay: '1s'}}></div>
                        </div>

                        <div className="max-w-md mx-auto relative z-10">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mb-4 shadow-2xl shadow-purple-500/50 transform hover:scale-110 transition-transform">
                                    <Icon name="nfc" className={`w-10 h-10 text-white ${isScanning ? 'wavy' : ''}`} />
                                </div>
                                <h1 className="text-4xl font-bold text-white mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-200">NFC UID Reader</h1>
                                <p className="text-purple-200">Tap kartu NFC Anda untuk membaca UID</p>
                            </div>

                            <div className="glass-effect rounded-3xl shadow-2xl p-8 mb-6">
                                <div className="text-center">
                                    <div className={`flex items-center justify-center gap-2 mb-6 ${getStatusColor()} font-semibold`}>
                                        {getStatusIcon()}
                                        <span>{status}</span>
                                    </div>
                                    
                                    <div className="relative inline-flex items-center justify-center mb-8">
                                        {isScanning && (
                                            <>
                                                <div className="absolute w-32 h-32 bg-blue-400 rounded-full pulse-ring"></div>
                                                <div className="absolute w-32 h-32 bg-blue-400 rounded-full pulse-ring" style={{animationDelay: '1s'}}></div>
                                            </>
                                        )}
                                        <div className={`relative inline-flex items-center justify-center w-40 h-40 rounded-full transition-all ${
                                            isScanning ? 'bg-gradient-to-br from-blue-500 to-indigo-600 shadow-2xl shadow-blue-500/50' : 'bg-gradient-to-br from-indigo-500 to-purple-600 shadow-xl shadow-purple-500/30'
                                        }`}>
                                            {/* icon gets .wavy class when scanning */}
                                            <Icon name="nfc" className={`w-20 h-20 text-white ${isScanning ? 'wavy wavy-fallback' : ''}`} />
                                        </div>
                                    </div>

                                    {!nfcSupported && (
                                        <div className="bg-red-50 border-2 border-red-200 rounded-2xl p-4 mb-6">
                                            <div className="flex items-start gap-3">
                                                <Icon name="alertCircle" className="w-6 h-6 text-red-600 mt-0.5 flex-shrink-0" />
                                                <div className="text-left">
                                                    <p className="text-sm font-bold text-red-800 mb-1">NFC Tidak Didukung</p>
                                                    <p className="text-xs text-red-600">
                                                        Gunakan Chrome di Android atau Safari di iOS 13+ untuk mengakses fitur NFC.
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <button
                                        onClick={startNFCScan}
                                        disabled={!nfcSupported || isScanning}
                                        className={`w-full py-5 px-6 rounded-2xl font-bold text-lg text-white transition-all transform ${
                                            !nfcSupported || isScanning
                                                ? 'bg-gray-400 cursor-not-allowed'
                                                : 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 active:scale-95 shadow-xl hover:shadow-2xl shadow-purple-500/50'
                                        }`}
                                    >
                                        {isScanning ? (
                                            <span className="flex items-center justify-center gap-3">
                                                <div className="w-6 h-6 border-3 border-white border-t-transparent rounded-full animate-spin"></div>
                                                Memindai...
                                            </span>
                                        ) : (
                                            <span className="flex items-center justify-center gap-3">
                                                <Icon name="nfc" className="w-6 h-6" />
                                                Mulai Pindai NFC
                                            </span>
                                        )}
                                    </button>
                                </div>
                            </div>

                            <button
                                onClick={() => setShowHistory(!showHistory)}
                                className="w-full flex items-center justify-center gap-3 py-4 px-6 glass-effect hover:bg-white/90 rounded-2xl font-semibold text-gray-700 transition-all shadow-lg"
                            >
                                <Icon name="history" className="w-5 h-5" />
                                {showHistory ? 'Sembunyikan Riwayat' : 'Lihat Riwayat'} ({scanHistory.length})
                            </button>

                            {showHistory && (
                                <div className="mt-6 glass-effect rounded-3xl shadow-2xl p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">Riwayat Pemindaian</h3>
                                        {scanHistory.length > 0 && (
                                            <button
                                                onClick={clearHistory}
                                                className="text-sm text-red-600 hover:text-red-700 font-semibold px-3 py-1 rounded-lg hover:bg-red-50 transition-colors"
                                            >
                                                Hapus Semua
                                            </button>
                                        )}
                                    </div>

                                    {scanHistory.length === 0 ? (
                                        <div className="text-center py-12">
                                            <Icon name="history" className="w-16 h-16 text-gray-300 mx-auto mb-3" />
                                            <p className="text-gray-500">Belum ada riwayat</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3 max-h-96 overflow-y-auto">
                                            {scanHistory.map((entry, index) => (
                                                <div key={index} className="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-4 border border-gray-200 hover:border-indigo-300 hover:shadow-md transition-all">
                                                    <p className="font-mono font-bold text-lg text-gray-800 mb-2">{entry.uid}</p>
                                                    <div className="flex items-center justify-between">
                                                        <p className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">{entry.type}</p>
                                                        <p className="text-xs text-gray-500">{entry.timestamp}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="mt-8 text-center">
                                <div className="inline-flex items-center gap-2 glass-effect px-5 py-3 rounded-xl shadow-lg">
                                    <Icon name="smartphone" className="w-5 h-5 text-indigo-600" />
                                    <p className="text-sm text-gray-700 font-medium">
                                        Bekerja optimal di Chrome (Android) atau Safari (iOS 13+)
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ========== HALAMAN RESULT ==========
            return (
                <div className="min-h-screen bg-gradient-to-br from-emerald-900 via-teal-900 to-slate-900 p-4 sm:p-8 relative overflow-hidden">
                    {/* Background decoration */}
                    <div className="absolute inset-0 overflow-hidden">
                        <div className="absolute -top-40 -right-40 w-80 h-80 bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float"></div>
                        <div className="absolute -bottom-40 -left-40 w-80 h-80 bg-teal-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-float" style={{animationDelay: '1.5s'}}></div>
                    </div>

                    <div className="max-w-md mx-auto relative z-10">
                        <div className="flex items-center mb-8">
                            <button
                                onClick={scanAgain}
                                className="flex items-center gap-2 text-white/90 hover:text-white font-semibold bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl transition-all backdrop-blur-sm"
                            >
                                <Icon name="arrowLeft" className="w-5 h-5" />
                                Kembali
                            </button>
                        </div>

                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-28 h-28 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-3xl mb-4 shadow-2xl shadow-emerald-500/50 animate-bounce-custom">
                                <Icon name="checkCircle" className="w-16 h-16 text-white" />
                            </div>
                            <h1 className="text-4xl font-bold text-white mb-2">Pemindaian Berhasil!</h1>
                            <p className="text-emerald-200">Informasi kartu telah berhasil dibaca</p>
                        </div>

                        <div className="glass-effect rounded-3xl shadow-2xl p-8 mb-6">
                            <div className="flex items-center gap-2 mb-6">
                                <div className="w-1 h-6 bg-gradient-to-b from-emerald-500 to-teal-500 rounded-full"></div>
                                <h3 className="text-sm font-bold text-gray-600 uppercase tracking-wider">Informasi Kartu</h3>
                            </div>
                            
                            <div className="mb-6">
                                <label className="text-xs font-semibold text-gray-500 mb-2 block uppercase tracking-wide">UID Kartu</label>
                                <div className="gradient-border rounded-2xl p-5 bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
                                    <p className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 font-mono break-all text-center">
                                        {uid}
                                    </p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-xs font-semibold text-gray-500 mb-2 block uppercase tracking-wide">Tipe Kartu</label>
                                    <div className="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-4 border border-gray-200">
                                        <p className="text-sm font-bold text-gray-700">{cardType}</p>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-semibold text-gray-500 mb-2 block uppercase tracking-wide">Waktu Scan</label>
                                    <div className="bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl p-4 border border-gray-200">
                                        <p className="text-xs font-semibold text-gray-700">{scanTime}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button
                            onClick={copyUID}
                            className={`w-full flex items-center justify-center gap-3 py-5 px-6 rounded-2xl font-bold text-lg transition-all mb-4 shadow-xl transform ${
                                copied
                                    ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white scale-95'
                                    : 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white hover:from-indigo-700 hover:to-purple-700 active:scale-95 shadow-purple-500/50'
                            }`}
                        >
                            {copied ? (
                                <>
                                    <Icon name="check" className="w-6 h-6" />
                                    Tersalin ke Clipboard!
                                </>
                            ) : (
                                <>
                                    <Icon name="copy" className="w-6 h-6" />
                                    Salin UID
                                </>
                            )}
                        </button>

                        <div className="glass-effect rounded-3xl shadow-2xl p-8 mb-6">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-12 h-12 bg-gradient-to-br from-green-500 to-emerald-600 rounded-xl flex items-center justify-center shadow-lg shadow-green-500/30">
                                    <Icon name="send" className="w-6 h-6 text-white" />
                                </div>
                                <h3 className="text-xl font-bold text-gray-800">Kirim ke WhatsApp</h3>
                            </div>
                            
                            <p className="text-sm text-gray-600 mb-6 leading-relaxed">
                                Tidak perlu memasukkan nomor — Anda akan memilih penerima di WhatsApp. Pesan yang dikirim hanya berisi UID.
                            </p>

                            <button
                                onClick={sendToWhatsApp}
                                className="w-full flex items-center justify-center gap-3 py-5 px-6 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-xl shadow-green-500/50 transform"
                            >
                                <Icon name="send" className="w-6 h-6" />
                                Kirim ke WhatsApp
                            </button>
                        </div>

                        <button
                            onClick={scanAgain}
                            className="w-full flex items-center justify-center gap-3 py-5 px-6 glass-effect hover:bg-white/90 text-gray-700 rounded-2xl font-bold text-lg transition-all shadow-lg"
                        >
                            <Icon name="nfc" className="w-6 h-6" />
                            Pindai Kartu Lain
                        </button>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NFCReaderApp />);
    </script>
</body>
</html>
